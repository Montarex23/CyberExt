<!DOCTYPE html>
<html lang="pl" data-i18n-title="optionsPageTitle">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CyberGuard</title>
  <link rel="stylesheet" href="../common.css" />
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="container">
    <section class="welcome-hero" id="welcome" hidden>
      <div class="welcome-mascot pop-in" id="welcome-mascot"></div>
      <h1 data-i18n="welcomeTitle">Witaj! CyberGuard już Cię chroni 🛡️</h1>
      <p class="welcome-subtitle" data-i18n="welcomeSubtitle">Od tej chwili działam w tle i dbam o Twoje bezpieczeństwo w sieci. Możesz spokojnie przeglądać internet – dam Ci znać, jeśli strona wyda się podejrzana.</p>
      <button class="btn btn-primary welcome-close-btn" id="btn-close-welcome" type="button" data-i18n="welcomeCloseBtn">Rozumiem, zamknij</button>
    </section>

    <div id="settings-view">
      <h1 id="settings-title" data-i18n="optionsTitle"></h1>

      <div class="settings-grid">
        <section class="tile" aria-labelledby="feed-title">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </div>
          <h2 id="feed-title" data-i18n="optFeedTitle"></h2>
          <label class="switch-row">
            <input type="checkbox" id="auto-update" role="switch" />
            <span data-i18n="optFeedToggle"></span>
          </label>
          <p id="feed-status" class="tile-status"></p>
          <button class="btn btn-secondary btn-sm" id="btn-update" type="button" data-i18n="optFeedUpdateNow"></button>
        </section>

        <section class="tile" aria-labelledby="pw-title">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/><circle cx="12" cy="16" r="1" fill="currentColor"/></svg>
          </div>
          <h2 id="pw-title" data-i18n="optPasswordsTitle"></h2>
          <p class="tile-desc" data-i18n="optPasswordsText"></p>
          <ul class="items" id="pw-list"></ul>
          <p class="muted" id="pw-empty" data-i18n="optPasswordsEmpty" hidden></p>
          <div id="pw-clear-start">
            <button class="btn btn-danger btn-sm" id="btn-forget-all" type="button" data-i18n="optForgetAll"></button>
          </div>
          <div id="pw-clear-confirm" hidden>
            <p><strong data-i18n="optForgetAllConfirm"></strong></p>
            <div class="row">
              <button class="btn btn-danger btn-sm" id="btn-forget-all-yes" type="button" data-i18n="optForgetAllYes"></button>
              <button class="btn btn-secondary btn-sm" id="btn-forget-all-no" type="button" data-i18n="btnCancel"></button>
            </div>
          </div>
        </section>

        <section class="tile" aria-labelledby="trusted-title">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <h2 id="trusted-title" data-i18n="optTrustedTitle"></h2>
          <p class="tile-desc" data-i18n="optTrustedText"></p>
          <ul class="items" id="trusted-list"></ul>
          <p class="muted" id="trusted-empty" data-i18n="optEmptyList" hidden></p>
        </section>

        <section class="tile" aria-labelledby="allowed-title">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
          </div>
          <h2 id="allowed-title" data-i18n="optAllowedTitle"></h2>
          <p class="tile-desc" data-i18n="optAllowedText"></p>
          <ul class="items" id="allowed-list"></ul>
          <p class="muted" id="allowed-empty" data-i18n="optEmptyList" hidden></p>
        </section>

        <section class="tile tile-about" aria-labelledby="about-title">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          </div>
          <h2 id="about-title" data-i18n="optAboutTitle"></h2>
          <p class="tile-desc" data-i18n="optAbout2"></p>
          <p class="muted" id="version"></p>
        </section>
      </div>
    </div>
  </main>

  <script src="../../shared/mascot.js"></script>
  <script src="../i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
